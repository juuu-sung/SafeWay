      <text class="body" x="78" y="181">KakaoMaps SDK v2</text>
      <text class="body" x="78" y="237">Kakao Local API</text>
      <text class="body" x="78" y="293">Kakao Mobility Directions</text>
      <text class="body" x="78" y="349">KNSDK 내비게이션</text>
    </g>

