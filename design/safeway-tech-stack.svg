      <g transform="translate(49 54)" color="#F36F91"><use href="#icon-mic" width="40" height="40"/></g>
      <text class="title" x="104" y="86" fill="#F36F91">음성 UX</text>
      <text class="body" x="78" y="181">SpeechRecognizer</text>
      <text class="body" x="78" y="237">OpenAI TTS MP3</text>
      <text class="body" x="78" y="293">TextToSpeech fallback</text>
      <text class="body" x="78" y="349">MediaPlayer 재생</text>
    </g>

    <g transform="translate(1232 531)">
      <rect width="540" height="433" rx="22" fill="#FFFFFF" stroke="#F1E7EC" filter="url(#cardShadow)"/>
      <g transform="translate(49 54)" color="#E5484D"><use href="#icon-phone" width="40" height="40"/></g>
      <text class="title" x="104" y="86" fill="#E5484D">전화·긴급</text>
